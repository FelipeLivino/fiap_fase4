services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cardioia-backend
    environment:
      PORT: "5000"
      CARDIOIA_THRESHOLD: "0.5"
    ports:
      - "5000:5000"
    volumes:
      - ./notebooks/artifacts_cardioia_pytorch_multilabel:/app/notebooks/artifacts_cardioia_pytorch_multilabel:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  mobile:
    build:
      context: .
      dockerfile: mobile-app/Dockerfile
    container_name: cardioia-mobile
    environment:
      EXPO_NO_TELEMETRY: "1"
      __UNSAFE_EXPO_HOME_DIRECTORY: "/app/.expo-home"
      CI: "1"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend
    stdin_open: true
    tty: true
